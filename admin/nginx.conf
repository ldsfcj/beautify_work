# Admin SPA — runs behind the main reverse proxy which forwards
# `/admin/...` here with the prefix preserved. Built assets live
# at /usr/share/nginx/html/{index.html,assets/...} with Vite
# base='/admin/' so index.html references them as
# `/admin/assets/...`. We rewrite `/admin/(.*)` → `/(.*)` here so
# static files resolve, and `try_files` falls back to index.html
# for client-side routes (vue-router history mode).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed asset filenames under /assets/,
    # served through `/admin/assets/...` after the reverse proxy
    # forwards the original path. Strip the /admin/ prefix and
    # cache aggressively — filenames change on every rebuild.
    location ~ ^/admin/assets/(.+\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico))$ {
        rewrite ^/admin/assets/(.+\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico))$ /assets/$1 break;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Everything else under /admin/: rewrite the prefix away so
    # /admin/users → /users, then try the file. Unknown paths fall
    # back to index.html for vue-router.
    location /admin/ {
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Bare `/` inside this container — shouldn't normally be reached
    # behind the reverse proxy, but keeps the image usable for
    # `docker run -p 8080:80 admin` debugging.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
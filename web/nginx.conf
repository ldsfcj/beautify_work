# Web H5 — SPA served at the root path behind the main reverse proxy.
# vue-router uses HTML5 history mode (createWebHistory()), so deep
# links like `/history`, `/generating/123`, `/result/abc` need to
# fall back to index.html so the client-side router can resolve them.
# nginx:alpine's stock config returns 404 for any non-root path,
# which breaks refresh on those routes.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache Vite's hashed asset bundles aggressively — filenames
    # change on every rebuild so they're safe to keep long.
    location /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: serve the file if it exists, otherwise index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
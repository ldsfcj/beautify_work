# docker-compose.prod.yml 骨架 (Task 2 阶段只放骨架, 完整内容 deferred 到 P6 Task 38)
version: '3.9'
services:
  nginx:
    image: nginx:alpine
    ports: ["80:80", "443:443"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro, ./certs:/etc/nginx/certs:ro]
  web:    # 用户端 H5 静态
    image: ${REGISTRY}/web:${TAG}
  admin:  # 后台 H5 静态
    image: ${REGISTRY}/admin:${TAG}
  server: # NestJS
    image: ${REGISTRY}/server:${TAG}
    env_file: .env
  worker: # Bull Worker
    image: ${REGISTRY}/server:${TAG}
    command: node dist/workers/ai-worker
  postgres: { image: postgres:15-alpine, volumes: [pgdata:/var/lib/postgresql/data] }
  redis: { image: redis:7-alpine }

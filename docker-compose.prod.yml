# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d --build

services:
  # ── Reverse proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started
      admin:
        condition: service_started
    restart: unless-stopped

  # ── User-facing H5 ────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped

  # ── Admin console ─────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped

  # ── NestJS API server ─────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://app:app@postgres:5432/medical_aesthetics
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://${HOST_IP:-localhost}
      - ADMIN_URL=http://${HOST_IP:-localhost}/admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Bull Worker (reuses server image) ─────────────────────────
  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["node", "dist/workers/generate.worker.js"]
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://app:app@postgres:5432/medical_aesthetics
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: medical_aesthetics
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d medical_aesthetics"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
